 y="515" width="280" height="40" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="350.0" y="539.55" font-size="13" fill="#4c1d95" text-anchor="middle" font-weight="normal">sorted(): alphabetical order</text><path d="M350 555 V580" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#m-gray)"/><rect x="210" y="580" width="280" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="350.0" y="604.55" font-size="13" fill="#14532d" text-anchor="middle" font-weight="normal">Write attendance_clean.csv</text><path d="M350 620 V645" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#m-gray)"/><rect x="210" y="645" width="280" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="350.0" y="669.7" font-size="12" fill="#14532d" text-anchor="middle" font-weight="bold">Print report</text><text x="350.0" y="684.7" font-size="12" fill="#14532d" text-anchor="middle" font-weight="normal">original count, unique count, list</text><path d="M350 701 V800" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#m-gray)"/><rect x="295.0" y="802.0" width="110" height="36" rx="18.0" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="350.0" y="824.55" font-size="13" fill="#14532d" text-anchor="middle" font-weight="normal">End</text></svg>