d">1</text><path d="M450 525 V545" fill="none" stroke="#64748b" stroke-width="2"/><path d="M340 545 H560" fill="none" stroke="#64748b" stroke-width="2"/><path d="M340 545 V570" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#m-gray)"/><path d="M560 545 V570" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#m-gray)"/><text x="330" y="540" font-size="13" fill="#0f172a" text-anchor="end" font-weight="bold">2</text><text x="570" y="540" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold">3</text><rect x="45" y="570" width="170" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="130.0" y="596.85" font-size="11" fill="#1e3a8a" text-anchor="middle" font-weight="bold">Add Expense</text><text x="130.0" y="610.85" font-size="11" fill="#1e3a8a" text-anchor="middle" font-weight="normal">date, item, category, amount</text><rect x="255" y="570" width="170" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="340.0" y="596.85" font-size="11" fill="#14532d" text-anchor="middle" font-weight="bold">Show Expenses</text><text x="340.0" y="610.85" font-size="11" fill="#14532d" text-anchor="middle" font-weight="normal">print all records</text><rect x="475" y="570" width="170" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="560.0" y="599.85" font-size="11" fill="#14532d" text-anchor="middle" font-weight="bold">Category Totals</text><text x="560.0" y="613.85" font-size="11" fill="#14532d" text-anchor="middle" font-weight="normal">set of categories</text><text x="560.0" y="627.85" font-size="11" fill="#14532d" text-anchor="middle" font-weight="normal">sum() per category</text><rect x="700" y="570" width="140" height="50" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="770.0" y="591.85" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="bold">Exit</text><text x="770.0" y="605.85" font-size="11" fill="#0f172a" text-anchor="middle" font-